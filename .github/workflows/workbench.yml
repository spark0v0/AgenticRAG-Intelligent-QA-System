name: Workbench Core Checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -c requirements-verified.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run smoke && npm run build
        working-directory: frontend
      - run: python -m pytest tests/test_workbench_smoke.py tests/test_provider_settings.py tests/test_agent_upgrade.py tests/test_knowledge_smoke.py -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run smoke:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-smoke
          path: |
            docs/screenshots
            frontend/test-results
