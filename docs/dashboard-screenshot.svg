  <text x="30" y="342" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172322">历史会话</text>
  <rect x="30" y="366" width="244" height="70" rx="16" fill="#ffffff" stroke="#dce7e3"/>
  <text x="45" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172322">你好</text>
  <text x="45" y="418" font-family="Arial, sans-serif" font-size="13" fill="#7b8b88">你好</text>
  <text x="242" y="394" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#7b8b88">3 轮</text>

  <text x="320" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172322">新会话</text>
  <text x="320" y="72" font-family="Arial, sans-serif" font-size="14" fill="#7b8b88">先像正常助手一样聊天，遇到复杂问题再自动调用检索和工具。</text>
