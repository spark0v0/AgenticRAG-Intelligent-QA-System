  <text x="352" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8a9996">输入任意问题即可开始。你可以闲聊、问天气、让它联网搜索，也可以做资料分析和项目问答。</text>

  <rect x="320" y="526" width="880" height="278" rx="24" fill="#ffffff" stroke="#dce7e3"/>
