<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="824" viewBox="0 0 1600 824" role="img" aria-label="AgenticRAG 系统测试界面截图">
  <rect width="1600" height="824" fill="#edf4f1"/>
  <rect x="16" y="10" width="272" height="804" rx="24" fill="#ffffff" stroke="#dce7e3"/>
