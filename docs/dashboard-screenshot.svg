  <text x="1260" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172322">-</text>
  <rect x="1418" y="78" width="150" height="70" rx="14" fill="#ffffff" stroke="#dce7e3"/>
  <text x="1430" y="106" font-family="Arial, sans-serif" font-size="13" fill="#748581">评审分</text>
  <text x="1430" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172322">-</text>
