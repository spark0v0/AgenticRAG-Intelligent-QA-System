<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191b" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('rag-theme') === 'light' ? 'light' : 'dark'
      } catch {
        /* Use the dark default when storage is unavailable. */
      }
    </script>
    <style>
      html {
        background: #18191b;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #fff;
        color-scheme: light;
      }
    </style>
    <meta name="description" content="AgenticRAG 智能问答与检索工作台：从问题到有据可循的答案。" />
    <title>AgenticRAG · 智能问答与检索工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
