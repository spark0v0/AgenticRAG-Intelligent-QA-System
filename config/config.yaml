model:
  provider: openai
  model_name: ''
  fallback_models: []
  temperature: 0.2
  max_tokens: 1600
  timeout_seconds: 60
  supports_vision: false
model_profiles: []
retrieval:
  knowledge_paths:
  - README.md
  - docs
  - src
  include_globs:
  - '*.md'
  - '*.txt'
  - '*.py'
  - '*.yaml'
  - '*.yml'
  - '*.docx'
  collection_name: agenticrag_kb
  persist_dir: data/chroma
  retrieval_mode: hybrid
  chunk_size: 900
  chunk_overlap: 120
  embedding_dimension: 384
  max_document_chars: 12000
  max_results: 8
  knowledge_graph:
  - source: agenticrag
    relation: composed_of
    target: planner
    confidence: 0.95
  - source: agenticrag
    relation: composed_of
    target: retriever
    confidence: 0.95
  - source: agenticrag
    relation: composed_of
    target: critic
    confidence: 0.95
  - source: agenticrag
    relation: composed_of
    target: generator
    confidence: 0.95
  - source: agenticrag
    relation: composed_of
    target: router
    confidence: 0.95
system:
  max_retries: 1
  max_thinking_rounds: 5
  context_window_size: 4096
  enable_visualization: true
  memory_path: data/memory/sessions.sqlite3
router:
  simple_threshold: 0.35
  complex_threshold: 0.68
  use_llm: true
  fallback_to_rules: true
  llm_temperature: 0
  llm_max_tokens: 400
  llm_timeout_seconds: 4
  llm_max_history_turns: 3
planner:
  use_llm: true
  timeout_seconds: 8
  max_tasks: 8
  complexity_threshold: 0.55
retriever:
  tool_selection: policy
  selector_timeout_seconds: 5
  max_attempts: 2
  max_results: 8
  quality_threshold: 0.62
  default_strategy: parallel
  max_selected_tools: 3
  tool_timeout_seconds: 15
generator:
  enable_citation: true
  max_context_docs: 6
  max_context_chars: 2400
  max_history_turns: 6
  max_history_chars: 6000
critic:
  quality_threshold: 0.72
  retrieval_retry_threshold: 0.55
